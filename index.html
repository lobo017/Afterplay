<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Wizard's Chess — Fully offline chess learning and Stockfish analysis tool" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wizard's Chess</title>
    <style>
      html,
      body {
        background: #07080c;
        color: #cbd5e1;
      }
      .wc-boot {
        padding: 16px;
        font:
          600 16px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .wc-boot-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <!-- The shell shown for the first frame. It has a little text in both font stacks of the app on purpose: the
         browser's one-time font start-up (~35 ms) is then paid here, in a task of its own, and not together
         with the build of the app (src/main.ts). The app replaces it. -->
    <div id="app">
      <div class="wc-boot" aria-hidden="true">Wizard's Chess <span class="wc-boot-mono">0:00</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
